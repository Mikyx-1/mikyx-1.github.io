<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual floating-point addition pipeline</title>
  <desc id="desc">Operands pass through special-case handling, exponent alignment, significand addition, normalization, rounding, and destination-format storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>
  <style>
    text { font-family: Optima, Arial, sans-serif; fill: #111; }
    .box { fill: #f7f7f7; stroke: #333; stroke-width: 1.2; rx: 5; }
    .main { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .sub { font-size: 11px; text-anchor: middle; fill: #444; }
    .arrow { stroke: #555; stroke-width: 1.5; marker-end: url(#arrow); }
    .note { font-size: 12px; fill: #0645ad; }
  </style>
  <text x="20" y="30" class="main" text-anchor="start">x, y</text>
  <line x1="55" y1="26" x2="92" y2="26" class="arrow"/>
  <rect x="98" y="7" width="106" height="52" class="box"/>
  <text x="151" y="29" class="main">Classify</text><text x="151" y="46" class="sub">zero, NaN, infinity</text>
  <line x1="204" y1="33" x2="235" y2="33" class="arrow"/>
  <rect x="241" y="7" width="106" height="52" class="box"/>
  <text x="294" y="29" class="main">Align</text><text x="294" y="46" class="sub">shift smaller operand</text>
  <line x1="347" y1="33" x2="378" y2="33" class="arrow"/>
  <rect x="384" y="7" width="106" height="52" class="box"/>
  <text x="437" y="29" class="main">Add/subtract</text><text x="437" y="46" class="sub">signed significands</text>
  <line x1="490" y1="33" x2="521" y2="33" class="arrow"/>
  <rect x="527" y="7" width="106" height="52" class="box"/>
  <text x="580" y="29" class="main">Normalize</text><text x="580" y="46" class="sub">adjust significand, exponent</text>
  <line x1="633" y1="33" x2="664" y2="33" class="arrow"/>
  <rect x="670" y="7" width="80" height="52" class="box"/>
  <text x="710" y="29" class="main">Round</text><text x="710" y="46" class="sub">to destination</text>

  <line x1="710" y1="59" x2="710" y2="101" class="arrow"/>
  <rect x="596" y="107" width="154" height="52" class="box"/>
  <text x="673" y="129" class="main">Store result</text><text x="673" y="146" class="sub">or raise status flag</text>
  <text x="20" y="113" class="note">Guard, round, and sticky information supports correct final rounding.</text>
  <text x="20" y="139" class="sub" text-anchor="start">A processor may pipeline or combine stages; this is a semantic dataflow.</text>
  <text x="20" y="176" class="sub" text-anchor="start">The accumulator or destination format determines the final representable set.</text>
</svg>
